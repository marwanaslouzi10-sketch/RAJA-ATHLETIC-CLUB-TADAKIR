<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RCA TADAKIR TEST</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#06150d;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:450px;
    text-align:center;
}

h1{
    color:#20c463;
    font-size:40px;
}

.btn{
    display:block;
    width:100%;
    padding:18px 0;
    margin:15px 0;
    border-radius:15px;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    background:#20c463;
    color:#000;
}

.manager{
    background:#222;
    color:white;
}

.page{
    display:none;
}

.page:target{
    display:block;
}

#home{
    display:block;
}

#booking:target,
#manager:target{
    display:block;
}
</style>
</head>

<body>

<div class="box">

    <!-- HOME -->
    <div id="home" class="page">

        <h1>RCA TADAKIR</h1>

        <p>DERBY CASABLANCA</p>

        <a class="btn" href="#booking">
            🟢 MEMBER
        </a>

        <a class="btn manager" href="#manager">
            ⚫ MANAGER
        </a>

    </div>


    <!-- BOOKING -->
    <div id="booking" class="page">

        <h1>GET TICKET</h1>

        <p>RCA VS WAC</p>

        <p>04/10/2026 — 21:30</p>

        <p>Sir.alien Stadium</p>

        <a class="btn" href="#home">
            ← BACK
        </a>

    </div>


    <!-- MANAGER -->
    <div id="manager" class="page">

        <h1>MANAGER</h1>

        <p>RCA2026</p>

        <a class="btn" href="#home">
            ← BACK
        </a>

    </div>

</div>

</body>
</html>
