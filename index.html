<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RCA TADAKIR | Derby Casablanca</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% -15%,
            #16c968 0%,
            #07512d 22%,
            #031b10 48%,
            #010705 85%
        );

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND EFFECTS
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(0,255,130,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(0,255,130,.08),
            transparent 28%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:fixed;
    inset:0;
    z-index:-3;
    pointer-events:none;
    overflow:hidden;
}

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#39f58b;

    box-shadow:
        0 0 12px #39f58b,
        0 0 25px rgba(57,245,139,.5);

    animation:
        floatParticle
        linear
        infinite;
}

@keyframes floatParticle{

    0%{
        transform:
            translateY(110vh)
            translateX(0)
            scale(.3);

        opacity:0;
    }

    10%{
        opacity:.8;
    }

    90%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(-10vh)
            translateX(80px)
            scale(1);

        opacity:0;
    }
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1050px;

    margin:auto;

    padding:20px;
}


/* =========================================================
   PAGES
========================================================= */

.page{
    display:none;

    min-height:
        calc(100vh - 40px);

    align-items:center;
    justify-content:center;
}

.page.active{
    display:flex;

    animation:
        pageEnter
        .65s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes pageEnter{

    from{
        opacity:0;
        transform:
            translateY(35px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   CARD
========================================================= */

.card{
    position:relative;

    width:100%;
    max-width:900px;

    padding:42px;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(8,35,22,.94),
            rgba(1,12,7,.95)
        );

    border:
        1px solid
        rgba(95,255,160,.15);

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(25px);

    overflow:hidden;
}

.card::before{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    top:-140px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(29,240,113,.18),
            transparent 70%
        );

    pointer-events:none;
}

.card::after{
    content:"";

    position:absolute;

    width:200px;
    height:200px;

    bottom:-120px;
    left:-80px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,130,.1),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
    width:150px;
    height:150px;

    object-fit:contain;

    display:block;

    margin:
        0 auto 22px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(27,234,112,.3)
        );

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;
}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-9px);
    }
}


/* =========================================================
   TITLES
========================================================= */

h1{
    text-align:center;

    font-size:
        clamp(34px,6vw,58px);

    line-height:1;

    font-weight:1000;

    letter-spacing:-2px;

    margin-bottom:18px;
}

h2{
    text-align:center;

    font-size:
        clamp(25px,4vw,36px);

    font-weight:950;

    margin-bottom:15px;
}

.green{
    color:#21ed78;

    text-shadow:
        0 0 25px
        rgba(33,237,120,.25);
}

.subtitle{
    max-width:680px;

    margin:
        0 auto 30px;

    text-align:center;

    color:#aebeb5;

    line-height:1.85;

    font-size:15px;
}


/* =========================================================
   PREMIUM BUTTONS
========================================================= */

.btn{
    position:relative;

    width:100%;

    border:0;

    padding:17px 22px;

    border-radius:16px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #20ed78,
            #079343
        );

    font-size:16px;

    font-weight:950;

    letter-spacing:.3px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 12px 35px
        rgba(0,230,105,.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
}

.btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );

    transform:skewX(-20deg);

    transition:
        left .65s ease;
}

.btn:hover::before{
    left:140%;
}

.btn:hover{
    transform:
        translateY(-4px)
        scale(1.01);

    box-shadow:
        0 18px 45px
        rgba(0,240,110,.28);

    filter:brightness(1.08);
}

.btn:active{
    transform:
        translateY(0)
        scale(.98);
}

.btn.secondary{
    margin-top:12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:none;

    color:#c5d1ca;
}

.btn.secondary:hover{
    background:
        rgba(255,255,255,.08);

    border-color:
        rgba(33,237,120,.25);
}


/* =========================================================
   CURVA
========================================================= */

.curva{
    width:100%;

    height:370px;

    object-fit:cover;

    border-radius:22px;

    margin-bottom:25px;

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.4);

    transition:
        transform .5s ease,
        filter .5s ease;
}

.curva:hover{
    transform:scale(1.015);

    filter:
        brightness(1.08)
        saturate(1.1);
}


/* =========================================================
   NOTICE
========================================================= */

.notice{
    position:relative;

    padding:18px;

    margin:20px 0;

    border-radius:17px;

    text-align:center;

    line-height:1.7;

    color:#c7d5ce;

    background:
        linear-gradient(
            135deg,
            rgba(25,230,105,.08),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(25,230,105,.16);

    box-shadow:
        inset 0 0 25px
        rgba(25,230,105,.025);
}


/* =========================================================
   DERBY
========================================================= */

.derby-label{
    text-align:center;

    letter-spacing:5px;

    color:#8e9d95;

    font-size:12px;

    font-weight:950;

    margin-bottom:28px;
}

.teams{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:40px;

    margin-bottom:30px;
}

.team{
    width:190px;

    text-align:center;

    padding:20px 10px;

    border-radius:22px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.06);

    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.team:hover{
    transform:
        translateY(-6px);

    background:
        rgba(27,234,112,.05);

    border-color:
        rgba(27,234,112,.2);
}

.team img{
    width:105px;
    height:105px;

    object-fit:contain;

    margin-bottom:10px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(27,234,112,.2)
        );
}

.team-name{
    font-size:24px;

    font-weight:1000;

    letter-spacing:2px;
}

.team-sub{
    color:#7f8e86;

    font-size:11px;

    margin-top:5px;
}

.vs{
    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#21ed78;

    font-size:22px;

    font-weight:1000;

    background:
        rgba(27,234,112,.06);

    border:
        1px solid
        rgba(27,234,112,.25);

    box-shadow:
        0 0 30px
        rgba(27,234,112,.1);

    animation:
        vsPulse
        2.2s
        ease-in-out
        infinite;
}

@keyframes vsPulse{

    0%,
    100%{
        box-shadow:
            0 0 20px
            rgba(27,234,112,.08);
    }

    50%{
        box-shadow:
            0 0 40px
            rgba(27,234,112,.25);
    }
}


/* =========================================================
   INFO GRID
========================================================= */

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin:28px 0;
}

.info{
    padding:22px 12px;

    text-align:center;

    border-radius:19px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.info:hover{
    transform:translateY(-5px);

    background:
        rgba(27,234,112,.055);

    border-color:
        rgba(27,234,112,.18);
}

.info-icon{
    font-size:27px;

    margin-bottom:9px;
}

.info small{
    display:block;

    color:#7e8d85;

    margin-bottom:7px;

    font-size:10px;

    letter-spacing:1px;
}

.info strong{
    font-size:14px;
}


/* =========================================================
   FORM
========================================================= */

.form{
    margin-top:25px;
}

.field-label{
    display:block;

    margin:
        18px 0 9px;

    color:#c9d5ce;

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;
}

input[type="text"],
input[type="number"]{

    width:100%;

    padding:16px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline:none;

    background:
        rgba(255,255,255,.045);

    color:#fff;

    font-size:15px;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

input::placeholder{
    color:#68766e;
}

input:focus{
    border-color:#20ed78;

    background:
        rgba(27,234,112,.045);

    box-shadow:
        0 0 0 4px
        rgba(27,234,112,.07),
        0 0 25px
        rgba(27,234,112,.08);
}

input[type="number"]{
    appearance:textfield;
}


/* =========================================================
   SEATS
========================================================= */

.seats{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    margin-top:10px;
}

.seat{
    cursor:pointer;
}

.seat input{
    display:none;
}

.seat-box{
    position:relative;

    padding:25px;

    text-align:center;

    border-radius:20px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.1);

    transition:
        .3s ease;

    overflow:hidden;
}

.seat-box::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(27,234,112,.12),
            transparent 65%
        );

    opacity:0;

    transition:.3s;
}

.seat:hover .seat-box{
    transform:
        translateY(-4px);

    border-color:
        rgba(27,234,112,.3);
}

.seat input:checked + .seat-box{
    border-color:#21ed78;

    background:
        rgba(27,234,112,.09);

    box-shadow:
        0 0 35px
        rgba(27,234,112,.1),
        inset 0 0 25px
        rgba(27,234,112,.04);
}

.seat input:checked + .seat-box::before{
    opacity:1;
}

.seat-title{
    position:relative;

    font-size:21px;

    font-weight:1000;
}

.seat-price{
    position:relative;

    color:#21ed78;

    font-size:30px;

    font-weight:1000;

    margin-top:7px;
}

.seat-box small{
    position:relative;

    display:block;

    margin-top:5px;

    color:#78877f;

    font-size:11px;
}


/* =========================================================
   TOTAL
========================================================= */

.total-box{
    margin:24px 0;

    padding:23px;

    text-align:center;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(27,234,112,.07),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(27,234,112,.12);
}

.total-label{
    color:#87968e;

    font-size:11px;

    letter-spacing:2px;
}

.total{
    margin-top:6px;

    color:#21ed78;

    font-size:40px;

    font-weight:1000;

    text-shadow:
        0 0 25px
        rgba(27,234,112,.2);
}


/* =========================================================
   TICKET
========================================================= */

.ticket{
    background:#f5f7f5;

    color:#09130d;

    border-radius:25px;

    overflow:hidden;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.55);

    animation:
        ticketAppear
        .7s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes ticketAppear{

    from{
        opacity:0;

        transform:
            translateY(30px)
            rotateX(8deg)
            scale(.96);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            rotateX(0)
            scale(1);
    }
}

.ticket-head{
    padding:30px;

    text-align:center;

    color:white;

    background:
        linear-gradient(
            135deg,
            #042d19,
            #0da850
        );

    position:relative;
}

.ticket-head::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:-1px;

    height:1px;

    background:
        rgba(255,255,255,.25);
}

.ticket-head h2{
    margin:0;

    font-size:27px;
}

.ticket-head p{
    margin-top:7px;

    opacity:.8;

    font-size:12px;

    letter-spacing:2px;
}

.ticket-body{
    padding:28px;
}

.ticket-match{
    text-align:center;

    padding-bottom:25px;

    border-bottom:
        1px dashed
        #aab2ad;
}

.ticket-teams{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:22px;

    font-size:28px;

    font-weight:1000;
}

.ticket-vs{
    color:#079544;

    font-size:17px;
}

.ticket-competition{
    color:#6d776f;

    margin-top:8px;

    font-size:11px;

    letter-spacing:1px;
}

.ticket-info{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;

    margin-top:25px;
}

.ticket-detail{
    padding:15px;

    border-radius:14px;

    background:#e9eeeb;

    transition:.2s;
}

.ticket-detail:hover{
    background:#e0e8e3;
}

.ticket-detail small{
    display:block;

    color:#68736c;

    margin-bottom:5px;

    font-size:10px;

    letter-spacing:.5px;
}

.ticket-detail strong{
    font-size:14px;
}

.user-data{
    margin-top:22px;

    padding-top:20px;

    border-top:
        1px dashed
        #9ea9a2;
}

.user-data p{
    margin:9px 0;

    font-size:14px;
}

.total-ticket{
    margin-top:22px;

    padding:18px;

    border-radius:15px;

    text-align:center;

    background:#e7f3eb;
}

.total-ticket small{
    color:#68736c;

    font-size:10px;

    letter-spacing:1px;
}

.total-ticket strong{
    display:block;

    color:#078c45;

    font-size:37px;

    margin-top:4px;
}

.qr-box{
    text-align:center;

    margin-top:25px;

    padding-top:20px;

    border-top:
        1px dashed
        #9ea9a2;
}

.qr-box img{
    width:180px;
    height:180px;

    padding:8px;

    background:#fff;

    border-radius:13px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.1);
}

.qr-box p{
    margin-top:9px;

    color:#5f6b63;

    font-size:10px;
}

.ticket-code{
    margin-top:12px;

    text-align:center;

    font-weight:1000;

    letter-spacing:3px;

    color:#087d3e;

    font-size:12px;
}

.ticket-footer{
    padding:17px;

    text-align:center;

    background:#e9eeeb;

    color:#657068;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   SUCCESS
========================================================= */

.success{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    text-align:center;

    color:#21ed78;

    font-weight:950;

    margin-bottom:20px;

    animation:
        successPulse
        2s
        ease-in-out
        infinite;
}

@keyframes successPulse{

    0%,
    100%{
        opacity:.8;
    }

    50%{
        opacity:1;
    }
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#020806;

    transition:
        opacity .6s ease,
        visibility .6s ease;
}

.loading.hide{
    opacity:0;
    visibility:hidden;
}

.loader{
    width:65px;
    height:65px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.08);

    border-top-color:#21ed78;

    animation:
        spin
        .8s
        linear
        infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .page{
        min-height:
            calc(100vh - 24px);
    }

    .card{
        padding:25px 17px;

        border-radius:25px;
    }

    .logo{
        width:120px;
        height:120px;
    }

    h1{
        letter-spacing:-1px;
    }

    .subtitle{
        font-size:14px;
    }

    .curva{
        height:260px;
    }

    .teams{
        gap:8px;
    }

    .team{
        width:130px;

        padding:15px 5px;
    }

    .team img{
        width:75
