<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RCA | RAJAWI TICKETS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#008b45;
    --green2:#00d86a;
    --dark:#010503;
    --dark2:#06100a;
    --white:#ffffff;
    --gray:#a8b5ad;
    --gold:#d9b95b;
    --danger:#ff5757;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#010503;
    color:white;
    font-family:'Cairo',sans-serif;
}

/* =========================================
   PAGE SYSTEM
========================================= */

.page{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;
    height:100dvh;

    display:none;

    overflow-x:hidden;
    overflow-y:auto;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,210,100,.13),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #020604,
            #010302
        );

    animation:pageIn .55s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateX(35px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}

/* =========================================
   GLOBAL
========================================= */

.page::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,110,.018),
            transparent
        );

    z-index:0;
}

.container{
    position:relative;
    z-index:2;

    width:min(1100px,94%);
    margin:auto;
}

/* =========================================
   BUTTON
========================================= */

.btn{
    border:0;
    outline:0;

    min-width:170px;

    padding:15px 32px;

    border-radius:50px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #00783d,
            #00cb66
        );

    font-family:'Cairo',sans-serif;
    font-weight:900;
    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 0 30px rgba(0,220,100,.15),
        0 15px 35px rgba(0,0,0,.5);

    transition:.25s;
}

.btn:hover{
    transform:translateY(-4px) scale(1.03);

    box-shadow:
        0 0 45px rgba(0,255,110,.25),
        0 20px 45px rgba(0,0,0,.7);
}

.btn:active{
    transform:scale(.97);
}

/* =========================================
   INTRO
========================================= */

#intro{
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#intro.active{
    display:flex;
}

.intro-light{
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(0,255,110,.1);

    filter:blur(100px);

    pointer-events:none;
}

.intro-light.one{
    top:-300px;
    left:50%;

    transform:translateX(-50%);
}

.intro-light.two{
    bottom:-350px;
    right:-150px;
}

.intro-content{
    position:relative;
    z-index:5;

    width:95%;
    max-width:900px;

    padding:30px 15px;
}

.logo-big{
    width:240px;
    height:240px;

    object-fit:contain;

    filter:
        drop-shadow(0 0 30px rgba(0,255,110,.3))
        drop-shadow(0 25px 35px rgba(0,0,0,.8));

    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

}

.welcome{
    margin-top:20px;

    font-family:'Montserrat','Cairo',sans-serif;

    font-size:
        clamp(
            45px,
            10vw,
            92px
        );

    line-height:.95;

    font-weight:900;

    letter-spacing:-4px;

    text-transform:uppercase;
}

.welcome span{
    color:var(--green2);
}

.intro-sub{
    margin-top:22px;

    color:#93a39a;

    font-size:10px;

    letter-spacing:4px;
}

.intro-content .btn{
    margin-top:40px;
}

/* =========================================
   INFO
========================================= */

#info{
    padding:45px 0;
}

.info-top{
    text-align:center;
}

.small-logo{
    width:120px;
    height:120px;
    object-fit:contain;
}

.title{
    margin-top:10px;

    font-family:'Montserrat','Cairo',sans-serif;

    font-size:
        clamp(
            35px,
            7vw,
            65px
        );

    font-weight:900;

    text-transform:uppercase;
}

.title span{
    color:var(--green2);
}

.subtitle{
    max-width:700px;

    margin:15px auto 35px;

    color:var(--gray);

    font-size:14px;

    line-height:1.9;
}

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:22px;
}

.info-card{
    overflow:hidden;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4);
}

.info-img{
    height:260px;

    overflow:hidden;
}

.info-img img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.5s;
}

.info-card:hover .info-img img{
    transform:scale(1.07);
}

.info-text{
    padding:24px;
}

.info-text h2{
    font-size:24px;
    font-weight:900;
}

.info-text h2 span{
    color:var(--green2);
}

.info-text p{
    margin-top:10px;

    color:#aab7af;

    line-height:1.9;

    font-size:13px;
}

.next-area{
    text-align:center;
    padding:35px 0 20px;
}

/* =========================================
   CURVA
========================================= */

#curva{
    padding:45px 0;

    text-align:center;
}

.curva-img{
    display:block;

    width:min(900px,100%);

    height:450px;

    margin:auto;

    object-fit:cover;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px rgba(0,0,0,.7);
}

.curva-title{
    margin-top:25px;

    font-family:'Montserrat','Cairo',sans-serif;

    font-size:
        clamp(
            34px,
            7vw,
            65px
        );

    font-weight:900;
}

.curva-title span{
    color:var(--green2);
}

.curva-text{
    max-width:700px;

    margin:10px auto 30px;

    color:var(--gray);

    line-height:1.9;

    font-size:14px;
}

/* =========================================
   ROUNDS
========================================= */

#rounds{
    padding:45px 0 70px;
}

.round-header{
    text-align:center;

    margin-bottom:35px;
}

.round-header img{
    width:100px;
    height:100px;

    object-fit:contain;
}

.round-header h1{
    margin-top:5px;

    font-family:'Montserrat','Cairo',sans-serif;

    font-size:
        clamp(
            35px,
            7vw,
            60px
        );

    font-weight:900;
}

.round-header p{
    color:#8d9d94;

    font-size:12px;

    letter-spacing:2px;
}

.round-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.round-card{
    position:relative;

    min-height:205px;

    padding:23px;

    overflow:hidden;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(0,145,70,.17),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(0,255,110,.12);

    transition:.3s;
}

.round-card:hover{
    transform:translateY(-7px);

    border-color:
        rgba(0,255,110,.45);

    box-shadow:
        0 20px 50px
        rgba(0,180,80,.15);
}

.round-no{
    color:#7f8e86;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;
}

.match{
    margin-top:18px;

    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:20px;

    font-weight:900;

    line-height:1.5;
}

.match span{
    display:block;

    color:var(--green2);

    font-size:12px;

    margin:2px 0;
}

.round-card button{
    margin-top:18px;

    border:0;

    padding:10px 16px;

    border-radius:30px;

    background:var(--green);

    color:white;

    font-family:'Cairo',sans-serif;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.round-card button:hover{
    background:var(--green2);

    color:#001b0c;
}

/* =========================================
   FORM
========================================= */

#formPage{
    padding:40px 0;
}

.form-container{
    width:min(620px,94%);

    margin:auto;
}

.form-logo{
    display:block;

    width:105px;
    height:105px;

    object-fit:contain;

    margin:auto;
}

.form-title{
    text-align:center;

    margin-top:10px;

    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:42px;

    font-weight:900;
}

.selected-match{
    text-align:center;

    color:var(--green2);

    font-size:13px;

    font-weight:900;

    margin:6px 0 28px;
}

.form-box{
    padding:28px;

    border-radius:27px;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
}

.field{
    margin-bottom:19px;
}

.field label{
    display:block;

    margin-bottom:8px;

    color:#aebbb3;

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;
}

.field input{
    width:100%;

    height:54px;

    padding:0 16px;

    border:1px solid
        rgba(255,255,255,.13);

    border-radius:13px;

    outline:none;

    background:#07100b;

    color:white;

    font-family:'Cairo',sans-serif;
}

.field input:focus{
    border-color:var(--green2);

    box-shadow:
        0 0 0 3px
        rgba(0,220,100,.08);
}

.seat-title{
    margin:20px 0 10px;

    color:#aebbb3;

    font-size:11px;

    font-weight:900;

    letter-spacing:1px;
}

.seats{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.seat{
    position:relative;
}

.seat input{
    position:absolute;

    opacity:0;
}

.seat label{
    min-height:115px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    border:1px solid
        rgba(255,255,255,.13);

    border-radius:18px;

    background:#07100b;

    cursor:pointer;

    transition:.25s;
}

.seat label strong{
    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:19px;
}

.seat label span{
    color:#9eaca4;

    margin-top:4px;

    font-size:13px;
}

.seat input:checked + label{
    border-color:var(--green2);

    background:
        rgba(0,180,80,.18);

    box-shadow:
        0 0 30px
        rgba(0,220,90,.13);
}

.confirm-btn{
    width:100%;

    height:55px;

    margin-top:25px;

    border:0;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #007c3e,
            #00c766
        );

    color:white;

    font-family:'Cairo',sans-serif;

    font-weight:900;

    cursor:pointer;
}

/* =========================================
   SECURITY
========================================= */

#security{
    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;
}

#security.active{
    display:flex;
}

.security-box{
    width:min(510px,100%);

    padding:35px 25px;

    text-align:center;

    border-radius:28px;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 80px rgba(0,0,0,.5);
}

.lock{
    font-size:50px;
}

.security-box h2{
    margin-top:8px;

    font-size:27px;

    font-weight:900;
}

.security-sub{
    color:#9faea5;

    font-size:13px;

    margin-top:5px;
}

.question{
    margin:27px 0 15px;

    padding:20px;

    border-radius:16px;

    background:#010503;

    border:1px solid rgba(255,255,255,.1);

    font-family:'Montserrat',sans-serif;

    font-size:30px;

    font-weight:900;

    letter-spacing:7px;
}

.note{
    color:#e9c769;

    font-size:13px;

    line-height:1.9;

    margin-bottom:18px;
}

.answer{
    width:100%;

    height:55px;

    border:1px solid
        rgba(255,255,255,.13);

    border-radius:14px;

    background:#07100b;

    color:white;

    outline:none;

    text-align:center;

    font-size:20px;

    font-weight:900;

    letter-spacing:4px;
}

.answer:focus{
    border-color:var(--green2);
}

.error{
    display:none;

    color:var(--danger);

    font-size:13px;

    margin-top:12px;
}

/* =========================================
   TICKET
========================================= */

#ticketPage{
    padding:30px 15px 60px;
}

.ticket-container{
    width:min(950px,100%);

    margin:auto;
}

.ticket-actions{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:22px;
}

.ticket-actions button{
    border:1px solid
        rgba(255,255,255,.13);

    border-radius:30px;

    padding:11px 22px;

    color:white;

    background:#07100b;

    font-family:'Cairo',sans-serif;

    font-weight:900;

    cursor:pointer;
}

.ticket-actions .print{
    background:var(--green);

    border-color:var(--green);
}

.ticket{
    display:grid;

    grid-template-columns:
        1fr 250px;

    min-height:560px;

    overflow:hidden;

    border-radius:30px;

    color:#07100b;

    background:
        linear-gradient(
            135deg,
            #fbfdfb,
            #dce9e1
        );

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.65);
}

.ticket-main{
    position:relative;

    padding:35px;
}

.ticket-main::after{
    content:"";

    position:absolute;

    top:25px;
    right:0;
    bottom:25px;

    border-right:
        2px dashed
        rgba(0,0,0,.22);
}

.ticket-brand{
    display:flex;

    align-items:center;

    gap:13px;
}

.ticket-brand img{
    width:68px;
    height:68px;

    object-fit:contain;
}

.ticket-brand small{
    display:block;

    color:#60766a;

    font-size:9px;

    letter-spacing:2px;

    font-weight:900;
}

.ticket-brand strong{
    display:block;

    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:22px;

    font-weight:900;
}

.ticket-event{
    margin-top:48px;
}

.ticket-event small{
    color:#647a6d;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;
}

.ticket-event h1{
    margin-top:7px;

    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:
        clamp(
            34px,
            6vw,
            60px
        );

    line-height:1;

    font-weight:900;
}

.ticket-event h1 span{
    color:#008b45;
}

.ticket-info{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-top:45px;
}

.ticket-item small{
    display:block;

    color:#71867b;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;
}

.ticket-item strong{
    display:block;

    margin-top:4px;

    font-size:13px;

    word-break:break-word;
}

.ticket-users{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    margin-top:30px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(0,0,0,.12);

    font-size:12px;
}

.ticket-users b{
    color:#008b45;
}

.ticket-notice{
    margin-top:22px;

    padding:13px;

    border-radius:12px;

    background:
        rgba(0,130,60,.08);

    color:#40574a;

    font-size:10px;

    line-height:1.8;
}

.ticket-side{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    background:
        linear-gradient(
            180deg,
            rgba(0,130,60,.11),
            rgba(0,130,60,.02)
        );
}

.ticket-side h2{
    font-family:
        'Montserrat',
        'Cairo',
        sans-serif;

    font-size:25px;

    font-weight:900;
}

.ticket-side p{
    color:#62796d;

    font-size:9px;

    font-weight:800;

    letter-spacing:1px;
}

.qr{
    width:155px;
    height:155px;

    margin:22px 0 18px;

    padding:7px;

    border-radius:8px;

    background:white;
}

.qr img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.barcode{
    width:185px;
    height:55px;

    padding:5px;

    display:flex;

    align-items:stretch;
    justify-content:center;

    gap:2px;

    overflow:hidden;

    background:white;
}

.bar{
    height:100%;

    background:#000;
}

.ticket-id{
    margin-top:13px;

    color:#53685c;

    font-family:'Montserrat',sans-serif;

    font-size:9px;

    letter-spacing:2px;
}

.success{
    text-align:center;

    margin-top:20px;

    color:#a6b5ac;

    font-size:13px;

    line-height:1.8;
}

.success strong{
    color:var(--green2);
}

/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:99999;

    transform:
        translate(-50%,120px);

    opacity:0;

    padding:13px 22px;

    border-radius:30px;

    background:#09160e;

    border:1px solid
        rgba(0,255,110,.25);

    color:white;

    font-size:13px;

    transition:.3s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:850px){

    .round-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .ticket{
        grid-template-columns:1fr;
    }

    .ticket-main::after{
        display:none;
    }

    .ticket-side{
        border-top:
            2px dashed
            rgba(0,0,0,.2);
    }

}

@media(max-width:650px){

    .logo-big{
        width:185px;
        height:185px;
    }

    .welcome{
        letter-spacing:-2px;
    }

    .intro-sub{
        letter-spacing:2px;
        font-size:8px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .info-img{
        height:220px;
    }

    .curva-img{
        height:270px;
    }

    .round-grid{
        gap:10px;
    }

    .round-card{
        min-height:185px;
        padding:18px;
    }

    .match{
        font-size:16px;
    }

    .round-card button{
        font-size:9px;
        padding:9px 11px;
    }

    .ticket-main{
        padding:24px;
    }

    .ticket-info{
        grid-template-columns:
            repeat(2,1fr);

        gap:15px;
    }

    .ticket-users{
        grid-template-columns:1fr;
    }

}

@media(max-width:400px){

    .round-grid{
        grid-template-columns:1fr;
    }

    .seats{
        grid-template-columns:1fr;
    }

    .ticket-info{
        grid-template-columns:1fr;
    }

}

/* =========================================
   PRINT
========================================= */

@media print{

    @page{
        size:A4;
        margin:10mm;
    }

    html,
    body{
        overflow:visible !important;
        background:white !important;
    }

    body *{
        visibility:hidden !important;
    }

    #ticketPage,
    #ticketPage *{
        visibility:visible !important;
    }

    #ticketPage{
        position:absolute !important;

        inset:auto !important;

        width:100% !important;

        height:auto !important;

        display:block !important;

        padding:0 !important;

        overflow:visible !important;

        background:white !important;
    }

    .ticket-actions,
    .success{
        display:none !important;
    }

    .ticket-container{
        width:100% !important;
    }

    .ticket{
        width:100% !important;

        min-height:500px !important;

        border-radius:0 !important;

        box-shadow:none !important;
    }

}

</style>
  </head>
